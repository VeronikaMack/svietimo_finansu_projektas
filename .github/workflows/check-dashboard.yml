name: Check dashboard

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  visit-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open dashboard and check it loads
        env:
          APP_URL: https://svietimofinansuprojektas-fusq6ekjjdczfkngaoqmnt.streamlit.app
        run: |
          python - <<'PY'
          import os
          import re
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(
                  os.environ["APP_URL"],
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              wake_button = page.get_by_role(
                  "button",
                  name=re.compile("get this app back up", re.I),
              )

              try:
                  wake_button.wait_for(state="visible", timeout=10000)
                  wake_button.click()
              except Exception:
                  pass

              page.get_by_role(
                  "heading",
                  name="Where does Lithuania's education money go?",
                  exact=True,
              ).wait_for(state="visible", timeout=180000)

              print("Dashboard loaded successfully.")
              browser.close()
          PY
